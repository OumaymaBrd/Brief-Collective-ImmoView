            <h2 class="o_h2"style="font-family: 'Bree Serif'; font-size: 20px; font-weight: bold;">Merci de compléter le formulaire.</h2>
            <form >
                <label for="name" id="label1">Full Name:</label>
                <input type="text" id="name" placeholder="Entrer Votre Nom">

                <label for="email" id="label1">Email :</label>
                <input type="email" id="email" placeholder="Entrer Votre Email">

                <label for="image" id="label1">Insérer Image :</label>
                <input type="file" id="image">

                <label for="opinion" id="label1">Votre opinion :</label>
                <textarea id="opinion" placeholder="Entrer Votre Opinion"></textarea>

                <button type="submit">Envoyer</button>
            </form>
            <div class="alert" id="alert"></div>

<script>
    document.getElementById("myForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const opinion = document.getElementById("opinion").value.trim();
        const alertDiv = document.getElementById("alert");
        let alertMessage = "";

        // Validation du nom complet (doit contenir au moins deux mots)
        const nameRegex = /^[a-zA-Z]{2,}(?:\s[a-zA-Z]{2,})+$/;
        if (!nameRegex.test(name)) {
            alertMessage += "Le nom complet doit contenir au moins deux mots. <br>";
        }

        // Validation de l'email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alertMessage += "Veuillez entrer un email valide. <br>";
        }

        // Validation de l'opinion (doit avoir au moins 10 caractères)
        if (opinion.length < 10) {
            alertMessage += "Votre opinion doit contenir au moins 10 caractères. <br>";
        }

        // Affichage des alertes si des erreurs existent
        if (alertMessage) {
            alertDiv.innerHTML = alertMessage;
            alertDiv.style.display = "block";
        } else {
            alertDiv.style.display = "none";
            alert("Formulaire soumis avec succès !");
            // Ici, vous pouvez ajouter le code pour soumettre le formulaire
        }
    });
</script>
